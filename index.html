<html lang="ru">

<title>Досье по номеру</title>
<style>

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;

    color: #e6e6e6;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    max-width: 520px;
    width: 100%;
    background: rgba(18, 18, 32, 0.9);
    border: 1px solid #2a2a4a;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 0 60px rgba(80, 80, 200, 0.2);
    margin-top: 20px;
  }
  h1 {
    text-align: center;
    color: #7ee8fa;
    font-size: 24px;
    margin: 0 0 25px;
    text-shadow: 0 0 12px rgba(126, 232, 250, 0.4);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  h1 svg { width: 26px; height: 26px; fill: #7ee8fa; }
  label {
    margin-bottom: 6px;
    font-size: 13px;
    color: #9090b0;
    display: flex; align-items: center; gap: 6px;
  }
  label svg { width: 14px; height: 14px; fill: #7ee8fa; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333355;
    background: #12122a;
    color: #fff;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
    transition: 0.2s;
  }
  input:focus {
    border-color: #7ee8fa;
    box-shadow: 0 0 8px rgba(126,232,250,0.3);
  }
  .gender-switch {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .gender-switch button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333355;
    background: #12122a;
    color: #8080a0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .gender-switch button svg { width: 16px; height: 16px; fill: currentColor; }
  .gender-switch button.active {
    background: linear-gradient(90deg, #7ee8fa, #8a7dfa);
    color: #0a0a15;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(126,232,250,0.35);
  }
  .gen-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #7ee8fa, #8a7dfa);
    color: #0a0a15;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .gen-btn svg { width: 18px; height: 18px; fill: #0a0a15; }
  .gen-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(126,232,250,0.4);
  }
</style>
</head>
<body>

    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4a3 3 0 110 6 3 3 0 010-6zm0 13c-2.5 0-4.71-1.28-6-3.23.03-2 4-3.1 6-3.1s5.97 1.1 6 3.1A7.02 7.02 0 0112 18z"/></svg>

 </div>
 <script>
/* ============ БАЗЫ ДАННЫХ ============ */

const blood = ["I (0) Rh+","I (0) Rh−","II (A) Rh+","II (A) Rh−","III (B) Rh+","III (B) Rh−","IV (AB) Rh+","IV (AB) Rh−"];
const nationality = ["русский(ая)","украинец(ка)","белорус(ка)","татарин(ка)","казах(ка)","армянин(ка)","грузин(ка)","еврей(ка)","немец(ка)","чуваш(ка)","башкир(ка)","мордвин(ка)"];
const cars = ["Lada Vesta","Kia Rio","Hyundai Solaris","Toyota Camry","BMW 3 Series","Mercedes E-Class","Skoda Octavia","VW Polo","Renault Logan","Nissan Qashqai","Mazda 6","Audi A4","Ford Focus","Chery Tiggo","Haval Jolion","Geely Coolray"];
const banks = ["Сбербанк","Тинькофф","Альфа-Банк","ВТБ","Райффайзен","Газпромбанк","Открытие","Совкомбанк","Почта Банк","Росбанк"];
const operators = ["МТС","Билайн","МегаФон","Tele2","Yota","СберМобайл","Тинькофф Мобайл"];
const mbti = ["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP","ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];

  /* ============ УТИЛИТЫ ============ */
const rand = a => a[Math.floor(Math.random() * a.length)];
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pad = (n, l) => String(n).padStart(l, "0");
const translitMap = {а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};
const translit = s => s.toLowerCase().split("").map(c => translitMap[c] || c).join("");

function randomDate(y1, y2) {
  const y = randInt(y1, y2);
  return `${pad(randInt(1,28),2)}.${pad(randInt(1,12),2)}.${y}`;
}
function zodiac(day, month) {
  const z = ["Козерог","Водолей","Рыбы","Овен","Телец","Близнецы","Рак","Лев","Дева","Весы","Скорпион","Стрелец","Козерог"];
  const d = [20,19,21,20,21,21,23,23,23,23,22,22];
  return z[month - (day < d[month-1] ? 1 : 0)];
}
function chineseZodiac(year) {
  const animals = ["Крыса","Бык","Тигр","Кролик","Дракон","Змея","Лошадь","Коза","Обезьяна","Петух","Собака","Свинья"];
  return animals[(year - 4) % 12];
}

/* ============ ГЕНЕРАТОРЫ ДОКУМЕНТОВ ============ */
function makePassport() { return `${pad(randInt(1000,9999),4)} ${pad(randInt(100000,999999),6)}`; }
function makeINN() { let s = ""; for (let i=0;i<12;i++) s += randInt(0,9); return s; }
function makeSNILS() {
  let s = ""; for (let i=0;i<11;i++) s += randInt(0,9);
  return s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1-$2-$3 $4");
}
function makeOMS() { return pad(randInt(1000,9999),4) + " " + pad(randInt(100000,999999),6); }
function makeLicense() { return `${pad(randInt(1,99),2)} АА ${pad(randInt(100000,999999),6)}`; }
function makeCard() {
  let num = "4"; for (let i=0;i<15;i++) num += randInt(0,9);
  return num.replace(/(\d{4})(?=\d)/g, "$1 ");
}
function makeCarPlate() {
  const L = "АВЕКМНОРСТУХ";
  return `${L[randInt(0,L.length-1)]}${pad(randInt(100,999),3)}${L[randInt(0,L.length-1)]}${L[randInt(0,L.length-1)]} ${pad(randInt(1,199),2)}`;
}
function makeIMEI() { let s = ""; for (let i=0;i<15;i++) s += randInt(0,9); return s; }
function makeIP() { return `${randInt(5,220)}.${randInt(0,255)}.${randInt(0,255)}.${randInt(1,254)}`; }
function makeOGRNIP() { let s = ""; for (let i=0;i<15;i++) s += randInt(0,9); return s; }
function makeCrypto() {
  const chars = "0123456789abcdef";
  let s = "0x"; for (let i=0;i<40;i++) s += chars[randInt(0,15)]; return s;
}
function makePhoneModel() {
  return rand(["Samsung Galaxy S23","Samsung Galaxy A54","Xiaomi Redmi Note 12","iPhone 13","iPhone 14 Pro","Google Pixel 7","Honor 90","Realme 10","Poco X5","Huawei P60"]);
}
function makeOS() { return rand(["Android 13","Android 14","iOS 16","iOS 17","HarmonyOS 4"]); }
function makeCarInsurance() { return "ХХХ " + pad(randInt(1000000000,9999999999),10); }
function makeCreditScore() { return randInt(300, 900); }

/* ============ ПЕРЕКЛЮЧАТЕЛЬ ПОЛА ============ */
let selectedGender = "male";
document.querySelectorAll("#genderSwitch button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#genderSwitch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedGender = btn.dataset.gender;
  });
});
  /* ============ ОСНОВНАЯ ФУНКЦИЯ ============ */
function generate() {
  const phone = document.getElementById("phone").value.trim() || "+7 000 000-00-00";
  let age = parseInt(document.getElementById("age").value) || 25;
  if (age < 1) age = 1; if (age > 120) age = 120;

  const isMale = selectedGender === "male";
  const first = isMale ? rand(maleFirst) : rand(femaleFirst);
  const mid = isMale ? rand(maleMid) : rand(femaleMid);
  const lastBase = rand(lastMale);
  const last = isMale ? lastBase : lastBase + "а";
  const fio = `${last} ${first} ${mid}`;

  const currentYear = new Date().getFullYear();
  const birthYear = currentYear - age;
  const birthDay = randInt(1, 28);
  const birthMonth = randInt(1, 12);
  const birthDate = `${pad(birthDay,2)}.${pad(birthMonth,2)}.${birthYear}`;
  const z = zodiac(birthDay, birthMonth);
  const chz = chineseZodiac(birthYear);

  const fatherFio = `${lastBase} ${rand(maleFirst)} ${rand(maleMid)}`;
  const fatherAge = age + randInt(20, 35);
  const fatherBirth = currentYear - fatherAge;
  const fatherWork = rand(jobs);

  const motherFio = `${isMale ? lastBase + "а" : lastBase} ${rand(femaleFirst)} ${rand(femaleMid)}`;
  const motherAge = age + randInt(18, 33);
  const motherBirth = currentYear - motherAge;
  const motherWork = rand(jobs);

  let spouse = "—", spouseBirth = "—", kids = "нет", marriageDate = "—";
  if (age >= 18 && Math.random() < 0.55) {
    spouse = isMale
      ? `${lastBase}а ${rand(femaleFirst)} ${rand(femaleMid)}`
      : `${lastBase} ${rand(maleFirst)} ${rand(maleMid)}`;
    spouseBirth = randomDate(birthYear - 5, birthYear + 8);
    marriageDate = randomDate(birthYear + 20, currentYear - 1);
    if (age >= 20 && Math.random() < 0.65) {
      const n = randInt(1, 3);
      kids = n + " " + (n === 1 ? "ребёнок" : n < 5 ? "ребёнка" : "детей");
      const kidNames = [];
      for (let i = 0; i < n; i++) {
        const kidMale = Math.random() < 0.5;
        kidNames.push((kidMale ? rand(maleFirst) : rand(femaleFirst)) + ` (${randomDate(birthYear + 20, Math.max(birthYear + 21, currentYear - 1))})`);
      }
      kids += ": " + kidNames.join(", ");
    }
  }

  let occupation;
  if (age < 7) occupation = "Детский сад №" + randInt(1, 200);
  else if (age < 18) occupation = "МБОУ СОШ №" + randInt(1, 200) + ", " + randInt(1, 11) + " класс";
  else if (age < 23 && Math.random() < 0.6) occupation = rand(educations) + " — студент(ка) " + randInt(1, 6) + " курса";
  else occupation = rand(jobs);

  const city = rand(cities);
  const address = `${city}, ${rand(streets)}, д. ${randInt(1,150)}, кв. ${randInt(1,300)}`;
  const email = `${translit(first)}.${translit(lastBase)}${randInt(1,99)}@${rand(["mail.ru","yandex.ru","gmail.com","bk.ru","inbox.ru","list.ru"])}`;
  const operator = rand(operators);

  const risk = randInt(1, 100);
  const riskLabel = risk < 40 ? ["Низкий", "risk-low"] : risk < 75 ? ["Средний", "risk-mid"] : ["Высокий", "risk-high"];

  const cat = isMale && age >= 17 && age <= 60 ? rand(["А1","А2","Б1","Б2","Б3","В","Г","Д"]) : "—";
  const troop = isMale && age >= 18 && age <= 60 ? rand(troops) : "—";

  const companies = [];
  if (age >= 22) {
    const n = randInt(1, 3);
    for (let i = 0; i < n; i++) {
      companies.push(`${rand(jobs)} (${randomDate(birthYear + 22, currentYear - 1)} — ${i === 0 ? "н.в." : randomDate(currentYear - 5, currentYear - 1)})`);
    }
  }
  const experience = age >= 22 ? randInt(1, age - 20) : 0;

  const siblings = [];
  if (Math.random() < 0.6) {
    const n = randInt(1, 3);
    for (let i = 0; i < n; i++) {
      const sMale = Math.random() < 0.5;
      const name = sMale ? rand(maleFirst) : rand(femaleFirst);
      const diff = randInt(-10, 10);
      siblings.push(`${name} (${Math.abs(age + diff)} лет)`);
    }
  }
  const siblingsStr = siblings.length ? siblings.join(", ") : "нет";

  const friends = [];
  for (let i = 0, n = randInt(2, 5); i < n; i++) {
    const fMale = Math.random() < 0.5;
    const fFirst = fMale ? rand(maleFirst) : rand(femaleFirst);
    const fLast = fMale ? rand(lastMale) : rand(lastMale) + "а";
    friends.push(`${fLast} ${fFirst} — +7 9${pad(randInt(0,99),2)} ${pad(randInt(1000000,9999999),7)}`);
  }

  let pets = "нет";
  if (Math.random() < 0.55) {
    const arr = [];
    for (let i = 0, n = randInt(1, 2); i < n; i++) arr.push(`${rand(petTypes)} «${rand(petNames)}»`);
    pets = arr.join(", ");
  }

  const trips = [];
  if (Math.random() < 0.7) {
    for (let i = 0, n = randInt(1, 4); i < n; i++) trips.push(rand(countries));
  }
  const tripsStr = trips.length ? [...new Set(trips)].join(", ") : "не выезжал(а)";

  const subscriptions = [];
  for (let i = 0, n = randInt(0, 4); i < n; i++) {
    const s = rand(subs);
    if (!subscriptions.includes(s)) subscriptions.push(s);
  }
  const subsStr = subscriptions.length ? subscriptions.join(", ") : "нет";

  const creditScore = makeCreditScore();
  const creditLabel = creditScore > 750 ? "Отличный" : creditScore > 600 ? "Хороший" : creditScore > 450 ? "Средний" : "Плохой";
  const creditsCount = randInt(0, 4);
  const loanSum = creditsCount > 0 ? randInt(50, 2500) : 0;

  const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(fio)}&backgroundColor=7ee8fa,8a7dfa`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(phone)}`;

  const bank = rand(banks);
  const hasCar = age >= 18 && Math.random() < 0.7;
  const car = hasCar ? `${rand(cars)} — ${makeCarPlate()}` : "нет";
  const osago = hasCar ? makeCarInsurance() : "—";
  const fines = hasCar ? randInt(0, 25) : 0;
  const finesSum = fines * randInt(500, 5000);
  const criminal = Math.random() < 0.85 ? "нет" : `условно, ст. ${randInt(100, 200)} УК РФ`;

  const schoolNum = randInt(1, 200);
  const gpa = (randInt(35, 50) / 10).toFixed(1);
  const diplomaNum = `${pad(randInt(1,99),2)} ${pad(randInt(100000,999999),6)}`;
  const specialty = rand(["Экономист","Юрист","Программист","Инженер","Врач","Учитель","Менеджер","Бухгалтер","Дизайнер","Маркетолог"]);

  const device = `${makePhoneModel()} / ${makeOS()}`;
  const insta = "@" + translit(first).slice(0,6) + randInt(10,9999);
  const tg = "@" + translit(first).slice(0,5) + "_" + randInt(10,999);
  const vk = "vk.com/id" + randInt(1000000, 999999999);
  const ip = makeIP();
  const imei = makeIMEI();
  const inn = age >= 14 ? makeINN() : "—";
  const snils = age >= 14 ? makeSNILS() : "—";
  const oms = makeOMS();
  const passport = age >= 14 ? makePassport() : "не получен";
  const passportIssued = age >= 14 ? `ОВД ${city}` : "—";
  const passportDate = age >= 14 ? randomDate(birthYear + 14, Math.min(birthYear + 45, currentYear)) : "—";
  const license = age >= 18 ? makeLicense() + " (" + rand(["A","B","C","BC","AB"]) + ")" : "нет";
  const ogrnip = Math.random() < 0.15 && age >= 18 ? makeOGRNIP() : "нет";
  const card = age >= 14 ? makeCard() : "нет";
  const crypto = Math.random() < 0.4 ? makeCrypto() : "нет";
  const bloodType = rand(blood);
  const nat = rand(nationality);
  const mbtiType = rand(mbti);
  const maritalStatus = age < 18 ? "Не в браке" : rand(marital);
  const abroad = age >= 18 && Math.random() < 0.6 ? `${pad(randInt(10,99),2)} ${pad(randInt(1000000,9999999),7)} (до ${randomDate(currentYear + 1, currentYear + 10)})` : "нет";

  /* ============ РЕНДЕР В НОВОМ ОКНЕ ============ */
  const html = buildResultHTML({
    phone, age, isMale, fio, birthDate, z, chz, city, nat, bloodType,
    address, passport, passportIssued, passportDate, inn, snils, oms, abroad,
    license, ogrnip, occupation, specialty, diplomaNum, schoolNum, birthYear,
    gpa, experience, companies, creditScore, creditLabel, creditsCount, loanSum,
    bank, card, crypto, subsStr, maritalStatus, spouse, spouseBirth, marriageDate,
    kids, siblingsStr, fatherFio, fatherBirth, fatherWork, motherFio, motherBirth,
    motherWork, pets, car, osago, fines, finesSum, hasCar, email, tg, insta, vk,
    device, imei, ip, tripsStr, criminal, cat, troop, mbtiType, friends,
    qrUrl, avatarUrl, operator, riskLabel
  });

  const w = window.open("", "_blank");
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* ============ СБОРКА HTML ДЛЯ НОВОГО ОКНА ============ */
function buildResultHTML(d) {
  const row = (k, v) => `<div class="row"><span class="key">${k}</span><span class="val">${v}</span></div>`;

  const companiesBlock = d.companies.length
    ? `<div class="row"><span class="key">Трудовая книжка</span><span class="val"></span></div>` +
      d.companies.map(c => `<div class="company-item">• ${c}</div>`).join("")
    : "";

  const friendsBlock = d.friends
    .map(f => `<div class="company-item">• ${f}</div>`).join("");

  return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досье — ${d.fio}</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0a15, #16162b, #0d0d1f);
    color: #e6e6e6;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    max-width: 780px;
    width: 100%;
    background: rgba(18, 18, 32, 0.9);
    border: 1px solid #2a2a4a;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 0 60px rgba(80, 80, 200, 0.2);
    margin-top: 20px;
  }
  .header-card {
    display: flex;
    gap: 18px;
    align-items: center;
    padding: 16px;
    background: linear-gradient(135deg, #1a1a35, #16162b);
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .avatar {
    width: 90px; height: 90px;
    border-radius: 12px;
    background: #0f0f1f;
    border: 2px solid #7ee8fa;
    flex-shrink: 0;
  }
  .header-info h2 { margin: 0 0 6px; color: #7ee8fa; font-size: 20px; }
  .header-info .status {
    color: #6be585; font-size: 12px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .header-info .status svg { width: 14px; height: 14px; fill: #6be585; }
  h2.section {
    color: #8a7dfa;
    font-size: 15px;
    margin: 22px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a4a;
    display: flex; align-items: center; gap: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  h2.section svg { width: 16px; height: 16px; fill: #8a7dfa; }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 4px;
    border-bottom: 1px solid #1e1e38;
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .row .key {
    color: #8080a0;
    width: 190px;
    min-width: 190px;
    flex-shrink: 0;
  }
  .row .val {
    color: #e6e6e6;
    font-weight: 500;
    flex: 1;
    line-height: 1.45;
  }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    background: #2a2a4a;
    color: #7ee8fa;
    margin-left: 6px;
  }
  .risk-low { color: #6be585; }
  .risk-mid { color: #ffcc55; }
  .risk-high { color: #ff6b6b; }
  .qr-wrap {
    display: flex; gap: 18px; align-items: center; margin-top: 12px;
    padding: 14px; background: #12122a;
    border-radius: 10px; border: 1px solid #2a2a4a;
  }
  .qr-wrap img {
    width: 130px; height: 130px;
    background: #fff; padding: 6px; border-radius: 8px;
  }
  .qr-text { font-size: 12px; color: #9090b0; line-height: 1.8; }
  .qr-text b { color: #7ee8fa; }
  .company-item {
    padding: 6px 4px 6px 20px;
    font-size: 13px;
    color: #c0c0d8;
    line-height: 1.5;
    border-bottom: 1px dashed #1e1e38;
  }
  .company-item:last-child { border-bottom: none; }

  @media (max-width: 560px) {
    .row {
      flex-direction: column;
      gap: 3px;
      padding: 10px 4px;
    }
    .row .key {
      width: auto;
      min-width: 0;
      font-size: 12px;
      color: #6a6a88;
    }
    .row .val { font-size: 14px; }
    .header-card { flex-direction: column; text-align: center; }
    .qr-wrap { flex-direction: column; }
    .container { padding: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-card">
    <img class="avatar" src="${d.avatarUrl}" alt="avatar">
    <div class="header-info">
      <h2>${d.fio}</h2>
      <div class="status">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        Данные подтверждены • Риск: <span class="${d.riskLabel[1]}">${d.riskLabel[0]} (${d.riskValue || ''}${d.riskLabel[0] === 'Низкий' ? '' : ''})</span>
      </div>
    </div>
  </div>

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    Личные данные
  </h2>
  ${row("Номер телефона", `${d.phone} <span class="badge">${d.operator}</span>`)}
  ${row("ФИО", d.fio)}
  ${row("Пол", d.isMale ? "Мужской" : "Женский")}
  ${row("Возраст", d.age + " лет")}
  ${row("Дата рождения", d.birthDate)}
  ${row("Знак зодиака", d.z + " / " + d.chz)}
  ${row("Место рождения", d.city)}
  ${row("Национальность", d.nat)}
  ${row("Группа крови", d.bloodType)}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Адрес и документы
  </h2>
  ${row("Адрес регистрации", d.address)}
  ${row("Паспорт РФ", d.passport)}
  ${row("Кем выдан", d.passportIssued)}
  ${row("Дата выдачи", d.passportDate)}
  ${row("ИНН", d.inn)}
  ${row("СНИЛС", d.snils)}
  ${row("Полис ОМС", d.oms)}
  ${row("Загранпаспорт", d.abroad)}
  ${row("Водительское", d.license)}
  ${row("ОГРНИП", d.ogrnip)}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
    Работа и образование
  </h2>
  ${row("Деятельность", d.occupation)}
  ${row("Образование", d.age >= 18 ? rand(educations) : "среднее")}
  ${row("Специальность", d.age >= 22 ? d.specialty : "—")}
  ${row("Диплом", d.age >= 22 ? d.diplomaNum : "—")}
  ${row("Школа", "МБОУ СОШ №" + d.schoolNum)}
  ${row("Средний балл", d.age >= 17 ? d.gpa : "—")}
  ${row("Стаж работы", d.experience + " лет")}
  ${row("Доход в месяц", "≈ " + randInt(20, 350) + " 000 ₽")}
  ${companiesBlock}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    Семья
  </h2>
  ${row("Семейное положение", d.maritalStatus)}
  ${row("Супруг(а)", d.spouse + (d.spouse !== "—" ? ` (${d.spouseBirth})` : ""))}
  ${row("Дата свадьбы", d.marriageDate)}
  ${row("Дети", d.kids)}
  ${row("Братья / сёстры", d.siblingsStr)}
  ${row("ФИО отца", `${d.fatherFio} (${d.fatherBirth} г.р.)`)}
  ${row("Работа отца", d.fatherWork)}
  ${row("ФИО матери", `${d.motherFio} (${d.motherBirth} г.р.)`)}
  ${row("Работа матери", d.motherWork)}
  ${row("Домашние питомцы", d.pets)}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    Финансы
  </h2>
  ${row("Банк", d.bank)}
  ${row("Банковская карта", d.card)}
  ${row("Кредитный рейтинг", d.creditScore + " — " + d.creditLabel)}
  ${row("Активных кредитов", d.creditsCount + (d.creditsCount > 0 ? ` (≈ ${d.loanSum} 000 ₽)` : ""))}
  ${row("Крипто-кошелёк", `<span style="font-size:11px;word-break:break-all">${d.crypto}</span>`)}
  ${row("Подписки", d.subsStr)}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>

  </h2>
  ${row("Автомобиль", d.car)}
  ${row("ОСАГО", d.osago)}
  ${row("Штрафы ГИБДД", `${d.fines} шт. на сумму ${d.finesSum} ₽`)}
  ${row("ДТП", d.hasCar ? randInt(0, 3) : 0)}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    Цифровой след
  </h2>
  ${row("Email", d.email)}
  ${row("Telegram", d.tg)}
  ${row("Instagram", d.insta)}
  ${row("VK", d.vk)}
  ${row("Устройство", d.device)}
  ${row("IMEI", d.imei)}
  ${row("IP-адрес", `${d.ip} <span class="badge">${d.city}</span>`)}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm3.5-9l-4.5-2.5v5l4.5 2.5V11z"/></svg>
    Дополнительно
  </h2>
  ${row("Загранпоездки", d.tripsStr)}
  ${row("Судимости", d.criminal)}
  ${d.isMale && d.age >= 17 ? `
    ${row("Воинский учёт", `${d.cat}, ${d.troop}`)}
    ${row("Военкомат", `Военкомат района ${d.city}`)}
  ` : ""}
  ${row("MBTI", d.mbtiType)}
  <div class="row"><span class="key">Близкие друзья</span><span class="val"></span></div>
  ${friendsBlock}

  <h2 class="section">
    <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
    QR-код
  </h2>
  <div class="qr-wrap">
    <img src="${d.qrUrl}" alt="qr">
    <div class="qr-text">
      Отсканируйте для доступа.<br>
      <b>Номер:</b> ${d.phone}<br>
      <b>Владелец:</b> ${d.fio}<br>
      <b>Оператор:</b> ${d.operator}
    </div>
  </div>
</div>
</body>
</html>`;
}
</script>
</body>
</html>
