      if (age >= 20 && Math.random() < 0.65) {
        const n = randInt(1, 3);
        kids = n + " " + (n === 1 ? "ребёнок" : n < 5 ? "ребёнка" : "детей");
        const kidNames = [];
        for (let i = 0; i < n; i++) {
          const kidMale = Math.random() < 0.5;
          const kid = (kidMale ? rand(maleFirst) : rand(femaleFirst)) + ` (${randomDate(birthYear + 20, Math.max(birthYear + 21, currentYear - 1))})`;
          kidNames.push(kid);
        }
        kids += ": " + kidNames.join(", ");
      }
    }
  }

  // Работа/учёба
  let occupation;
  if (age < 7) occupation = "Детский сад №" + randInt(1, 200);
  else if (age < 18) occupation = "МБОУ СОШ №" + randInt(1, 200) + ", " + randInt(1, 11) + " класс";
  else if (age < 23 && Math.random() < 0.6) occupation = rand(educations) + " — студент(ка) " + randInt(1, 6) + " курса";
  else occupation = rand(jobs);

  // Адрес
  const city = rand(cities);
  const address = `${city}, ${rand(streets)}, д. ${randInt(1,150)}, кв. ${randInt(1,300)}`;

  // Email
  const email = `${translit(first)}.${translit(lastBase)}${randInt(1,99)}@${rand(["mail.ru","yandex.ru","gmail.com","bk.ru","inbox.ru","list.ru"])}`;

  // Оператор
  const phoneClean = phone.replace(/\D/g, "");
  const operator = rand(operators);
  const region = rand(regions);

  // Риск
  const risk = randInt(1, 100);
  const riskLabel = risk < 40 ? ["Низкий", "risk-low"] : risk < 75 ? ["Средний", "risk-mid"] : ["Высокий", "risk-high"];

  // Воинский учёт
  const cat = isMale && age >= 17 && age <= 60 ? rand(["А1","А2","Б1","Б2","Б3","В","Г","Д"]) : "—";
  const troop = isMale && age >= 18 && age <= 60 ? rand(troops) : "—";
  const voenkomat = isMale && age >= 17 ? `Военкомат ${rand(["Центрального","Северного","Южного","Западного","Восточного"])} района ${city}` : "—";

  // Трудовая книжка
  const companies = [];
  if (age >= 22) {
    const n = randInt(1, 3);
    for (let i = 0; i < n; i++) {
      companies.push(`${rand(jobs)} (${randomDate(birthYear + 22, currentYear - 1)} — ${i === 0 ? "н.в." : randomDate(currentYear - 5, currentYear - 1)})`);
    }
  }
  const experience = age >= 22 ? randInt(1, age - 20) : 0;

  // Братья/сёстры
  const siblings = [];
  if (Math.random() < 0.6) {
    const n = randInt(1, 3);
    for (let i = 0; i < n; i++) {
      const sMale = Math.random() < 0.5;
      const name = sMale ? rand(maleFirst) : rand(femaleFirst);
      const diff = randInt(-10, 10);
      const sAge = age + diff;
      siblings.push(`${name} (${sAge > 0 ? sAge : Math.abs(sAge)} лет)`);
    }
  }
  const siblingsStr = siblings.length ? siblings.join(", ") : "нет";

  // Друзья
  const friendsCount = randInt(2, 5);
  const friends = [];
  for (let i = 0; i < friendsCount; i++) {
    const fMale = Math.random() < 0.5;
    const fFirst = fMale ? rand(maleFirst) : rand(femaleFirst);
    const fLast = fMale ? rand(lastMale) : rand(lastMale) + "а";
    friends.push(`${fLast} ${fFirst} — +7 9${pad(randInt(0,99),2)} ${pad(randInt(1000000,9999999),7)}`);
  }

  // Питомцы
  let pets = "нет";
  if (Math.random() < 0.55) {
    const n = randInt(1, 2);
    const arr = [];
    for (let i = 0; i < n; i++) arr.push(`${rand(petTypes)} «${rand(petNames)}»`);
    pets = arr.join(", ");
  }

  // Поездки
  const trips = [];
  if (Math.random() < 0.7) {
    const n = randInt(1, 4);
    for (let i = 0; i < n; i++) trips.push(rand(countries));
  }
  const tripsStr = trips.length ? [...new Set(trips)].join(", ") : "не выезжал(а)";

  // Подписки
  const subscriptions = [];
  const subN = randInt(0, 4);
  for (let i = 0; i < subN; i++) {
    const s = rand(subs);
    if (!subscriptions.includes(s)) subscriptions.push(s);
  }
  const subsStr = subscriptions.length ? subscriptions.join(", ") : "нет";

  // Кредиты
  const creditScore = makeCreditScore();
  const creditLabel = creditScore > 750 ? "Отличный" : creditScore > 600 ? "Хороший" : creditScore > 450 ? "Средний" : "Плохой";
  const creditsCount = randInt(0, 4);
  const loanSum = creditsCount > 0 ? randInt(50, 2500) : 0;

  // Аватар
  const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(fio)}&backgroundColor=7ee8fa,8a7dfa`;

  // QR-код
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(phone)}`;

  // Секретность
  const secrecy = rand(["СОВЕРШЕННО СЕКРЕТНО","ДЛЯ СЛУЖЕБНОГО ПОЛЬЗОВАНИЯ","СЕКРЕТНО","ДСП"]);

  // Банк
  const bank = rand(banks);

  // Авто
  const hasCar = age >= 18 && Math.random() < 0.7;
  const car = hasCar ? `${rand(cars)} — ${makeCarPlate()}` : "нет";

  // ОСАГО
  const osago = hasCar ? makeCarInsurance() : "—";

  // Штрафы
  const fines = hasCar ? randInt(0, 25) : 0;
  const finesSum = fines * randInt(500, 5000);

  // Судимости
  const criminal = Math.random() < 0.85 ? "нет" : `условно, ст. ${randInt(100, 200)} УК РФ`;

  // Школа
  const schoolNum = randInt(1, 200);
  const schoolYear = birthYear + 7;

  // Аттестат
  const gpa = (randInt(35, 50) / 10).toFixed(1);

  // Диплом
  const diplomaNum = `${pad(randInt(1,99),2)} ${pad(randInt(100000,999999),6)}`;
  const specialty = rand(["Экономист","Юрист","Программист","Инженер","Врач","Учитель","Менеджер","Бухгалтер","Дизайнер","Маркетолог"]);

  // Устройство
  const device = `${makePhoneModel()} / ${makeOS()}`;

  // Соцсети
  const insta = makeInstagram(first);
  const tg = makeTelegram(first);
  const vk = makeVk();

  // Рендер
  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = `
    <div class="secret-stamp">${secrecy}</div>

    <div class="header-card">
      <img class="avatar" src="${avatarUrl}" alt="avatar">
      <div class="header-info">
        <h2>${fio}</h2>
        <div class="status">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          Данные подтверждены • Риск: <span class="${riskLabel[1]}">${riskLabel[0]} (${risk}%)</span>
        </div>
      </div>
    </div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Личные данные
    </h2>
    <div class="row"><span class="key">Номер телефона</span><span class="val">${phone} <span class="badge">${operator}</span></span></div>
    <div class="row"><span class="key">ФИО</span><span class="val">${fio}</span></div>
    <div class="row"><span class="key">Пол</span><span class="val">${isMale ? "Мужской" : "Женский"}</span></div>
    <div class="row"><span class="key">Возраст</span><span class="val">${age} лет</span></div>
    <div class="row"><span class="key">Дата рождения</span><span class="val">${birthDate}</span></div>
    <div class="row"><span class="key">Знак зодиака</span><span class="val">${z} / ${chz}</span></div>
    <div class="row"><span class="key">Место рождения</span><span class="val">${city}</span></div>
    <div class="row"><span class="key">Национальность</span><span class="val">${rand(nationality)}</span></div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Адрес и документы
    </h2>
    <div class="row"><span class="key">Адрес регистрации</span><span class="val">${address}</span></div>
    <div class="row"><span class="key">Паспорт РФ</span><span class="val">${age >= 14 ? makePassport() : "не получен"}</span></div>
    <div class="row"><span class="key">Кем выдан</span><span class="val">${age >= 14 ? `ОВД ${city}` : "—"}</span></div>
    <div class="row"><span class="key">Дата выдачи</span><span class="val">${age >= 14 ? randomDate(birthYear + 14, Math.min(birthYear + 45, currentYear)) : "—"}</span></div>
    <div class="row"><span class="key">ИНН</span><span class="val">${age >= 14 ? makeINN() : "—"}</span></div>
    <div class="row"><span class="key">СНИЛС</span><span class="val">${age >= 14 ? makeSNILS() : "—"}</span></div>
    <div class="row"><span class="key">Полис ОМС</span><span class="val">${makeOMS()}</span></div>
    <div class="row"><span class="key">Загранпаспорт</span><span class="val">${age >= 18 && Math.random() < 0.6 ? `${pad(randInt(10,99),2)} ${pad(randInt(1000000,9999999),7)} (до ${randomDate(currentYear + 1, currentYear + 10)})` : "нет"}</span></div>
    <div class="row"><span class="key">Водительское</span><span class="val">${age >= 18 ? makeLicense() + " (" + rand(["A","B","C","BC","AB"]) + ")" : "нет"}</span></div>
    <div class="row"><span class="key">ОГРНИП</span><span class="val">${Math.random() < 0.15 && age >= 18 ? makeOGRNIP() : "нет"}</span></div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
      Работа и образование
    </h2>
    <div class="row"><span class="key">Деятельность</span><span class="val">${occupation}</span></div>
    <div class="row"><span class="key">Образование</span><span class="val">${age >= 18 ? rand(educations) : "среднее"}</span></div>
    <div class="row"><span class="key">Специальность</span><span class="val">${age >= 22 ? specialty : "—"}</span></div>
    <div class="row"><span class="key">Диплом</span><span class="val">${age >= 22 ? diplomaNum : "—"}</span></div>
    <div class="row"><span class="key">Школа</span><span class="val">МБОУ СОШ №${schoolNum}, окончил(а) в ${schoolYear + 11}</span></div>
    <div class="row"><span class="key">Средний балл</span><span class="val">${age >= 17 ? gpa : "—"}</span></div>
    <div class="row"><span class="key">Стаж работы</span><span class="val">${experience} лет</span></div>
    <div class="row"><span class="key">Доход в месяц</span><span class="val">≈ ${randInt(20, 350)} 000 ₽</span></div>
    ${companies.length ? `
      <div class="row"><span class="key">Трудовая книжка</span><span class="val"></span></div>
      ${companies.map(c => `<div class="company-item">• ${c}</div>`).join("")}
    ` : ""}

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Семья
    </h2>
    <div class="row"><span class="key">Семейное положение</span><span class="val">${age < 18 ? "Не в браке" : rand(marital)}</span></div>
    <div class="row"><span class="key">Супруг(а)</span><span class="val">${spouse}${spouse !== "—" ? ` (${spouseBirth})` : ""}</span></div>
    <div class="row"><span class="key">Дата свадьбы</span><span class="val">${marriageDate}</span></div>
    <div class="row"><span class="key">Дети</span><span class="val">${kids}</span></div>
    <div class="row"><span class="key">Братья / сёстры</span><span class="val">${siblingsStr}</span></div>
    <div class="row"><span class="key">ФИО отца</span><span class="val">${fatherFio} (${fatherBirth} г.р.)</span></div>
    <div class="row"><span class="key">Работа отца</span><span class="val">${fatherWork}</span></div>
    <div class="row"><span class="key">ФИО матери</span><span class="val">${motherFio} (${motherBirth} г.р.)</span></div>
    <div class="row"><span class="key">Работа матери</span><span class="val">${motherWork}</span></div>
    <div class="row"><span class="key">Домашние питомцы</span><span class="val">${pets}</span></div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      Финансы
    </h2>
    <div class="row"><span class="key">Банк</span><span class="val">${bank}</span></div>
    <div class="row"><span class="key">Банковская карта</span><span class="val">${age >= 14 ? makeCard() : "нет"}</span></div>
    <div class="row"><span class="key">Кредитный рейтинг</span><span class="val">${creditScore} — ${creditLabel}</span></div>
    <div class="row"><span class="key">Активных кредитов</span><span class="val">${creditsCount}${creditsCount > 0 ? ` (≈ ${loanSum} 000 ₽)` : ""}</span></div>
    <div class="row"><span class="key">Крипто-кошелёк</span><span class="val" style="font-size:11px;word-break:break-all">${Math.random() < 0.4 ? makeCrypto() : "нет"}</span></div>
    <div class="row"><span class="key">Подписки</span><span class="val">${subsStr}</span></div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
      Транспорт
    </h2>
    <div class="row"><span class="key">Автомобиль</span><span class="val">${car}</span></div>
    <div class="row"><span class="key">ОСАГО</span><span class="val">${osago}</span></div>
    <div class="row"><span class="key">Штрафы ГИБДД</span><span class="val">${fines} шт. на сумму ${finesSum} ₽</span></div>
    <div class="row"><span class="key">ДТП</span><span class="val">${hasCar ? randInt(0, 3) : 0}</span></div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      Цифровой след
    </h2>
    <div class="row"><span class="key">Email</span><span class="val">${email}</span></div>
    <div class="row"><span class="key">Telegram</span><span class="val">${tg}</span></div>
    <div class="row"><span class="key">Instagram</span><span class="val">${insta}</span></div>
    <div class="row"><span class="key">VK</span><span class="val">${vk}</span></div>
    <div class="row"><span class="key">Устройство</span><span class="val">${device}</span></div>
    <div class="row"><span class="key">IMEI</span><span class="val">${makeIMEI()}</span></div>
    <div class="row"><span class="key">IP-адрес</span><span class="val">${makeIP()} <span class="badge">${city}</span></span></div>

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm3.5-9l-4.5-2.5v5l4.5 2.5V11z"/></svg>
      Дополнительно
    </h2>
    <div class="row"><span class="key">Загранпоездки</span><span class="val">${tripsStr}</span></div>
    <div class="row"><span class="key">Судимости</span><span class="val">${criminal}</span></div>
    ${isMale && age >= 17 ? `
      <div class="row"><span class="key">Воинский учёт</span><span class="val">${cat}, ${troop}</span></div>
      <div class="row"><span class="key">Военкомат</span><span class="val">${voenkomat}</span></div>
    ` : ""}
    <div class="row"><span class="key">MBTI</span><span class="val">${rand(mbti)}</span></div>
    <div class="row"><span class="key">Близкие друзья</span><span class="val"></span></div>
    ${friends.map(f => `<div class="company-item">• ${f}</div>`).join("")}

    <h2 class="section">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
      QR-код
    </h2>
    <div class="qr-wrap">
      <img src="${qrUrl}" alt="qr">
      <div class="qr-text">
        Отсканируйте для быстрого доступа.<br>
        <b>Номер:</b> ${phone}<br>
        <b>Владелец:</b> ${fio}<br>
        <b>Регион:</b> ${region}<br>
        <b>Оператор:</b> ${operator}
      </div>
    </div>
  `;

  result.scrollIntoView({behavior: "smooth", block: "start"});
}
</script>
</body>
</html>
